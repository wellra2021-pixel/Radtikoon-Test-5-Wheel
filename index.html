<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>8 Lucky Wheels ปาร์ตี้ปีใหม่</title>
    
    <!-- เชื่อมต่อกับไฟล์ CSS -->
    <link rel="stylesheet" href="style.css">
    
    <!-- โหลดไลบรารีสำหรับจุดพลุ Confetti -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
</head>
<body>

    <header>
        <h1>🎉 8 Lucky Wheels ปาร์ตี้ปีใหม่ 🎉</h1>
        <p>ดึงข้อมูลผู้เข้าร่วมจาก Google Sheet</p>
        <button id="btn-spin-all" onclick="spinAll()">🔄 สุ่มทั้งหมดพร้อมกัน (Spin All)</button>
    </header>

    <!-- พื้นที่แสดงวงล้อทั้ง 8 -->
    <main id="wheels-container" class="grid-container"></main>

    <hr>

    <!-- พื้นที่สรุปรายชื่อผู้โชคดี -->
    <section class="summary-section">
        <h2>🏆 สรุปรายชื่อผู้โชคดีทั้ง 8 วงล้อ 🏆</h2>
        <div id="summary-container" class="grid-container-summary"></div>
    </section>

    <!-- หน้าต่าง Popup (Modal) แสดงผู้ชนะ -->
    <div id="winner-modal" class="modal">
        <div class="modal-content">
            <h2 id="modal-title">ยินดีด้วย! ผู้โชคดีวงล้อที่ <span id="modal-wheel-num"></span></h2>
            <div class="winner-img-container">
                <img id="modal-img" src="https://via.placeholder.com/150/4CAF50/FFFFFF?text=Winner" alt="Winner">
            </div>
            <h3 id="modal-name">ชื่อผู้โชคดี</h3>
            <button class="btn-close" onclick="closeModal()">ตกลง (OK)</button>
        </div>
    </div>

    <!-- เชื่อมต่อกับไฟล์ JavaScript (ต้องอยู่ก่อนปิด body) -->
    <script src="script.js"></script>
</body>
</html>

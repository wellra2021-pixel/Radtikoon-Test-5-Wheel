<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>8 Lucky Wheels ปาร์ตี้ปีใหม่</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
</head>
<body>

    <header>
        <h1>🎉 8 Lucky Wheels ปาร์ตี้ปีใหม่ 🎉</h1>
        <p>ดึงข้อมูลผู้เข้าร่วมจาก Google Sheet (คลิกที่รูปเพื่อดูรูปใหญ่ได้)</p>
        <button id="btn-spin-all" onclick="spinAll()">🔄 สุ่มทั้งหมดพร้อมกัน (Spin All)</button>
    </header>

    <main id="wheels-container" class="grid-container"></main>
    <hr>
    <section class="summary-section">
        <h2>🏆 สรุปรายชื่อผู้โชคดีทั้ง 8 วงล้อ 🏆</h2>
        <div id="summary-container" class="grid-container-summary"></div>
    </section>

    <!-- หน้าต่าง Popup (Modal) ตอนสุ่มได้ -->
    <div id="winner-modal" class="modal">
        <div class="modal-content">
            <h2 id="modal-title">ยินดีด้วย! ผู้โชคดีวงล้อที่ <span id="modal-wheel-num"></span></h2>
            <div class="winner-img-container">
                <img id="modal-img" src="https://via.placeholder.com/150?text=Winner" alt="Winner">
            </div>
            <h3 id="modal-name">ชื่อผู้โชคดี</h3>
            <button class="btn-close" onclick="closeModal()">ตกลง (OK)</button>
        </div>
    </div>

    <!-- หน้าต่างสำหรับคลิกดูรูปขยายใหญ่ (ตามแบบในภาพเป๊ะๆ) -->
    <div id="image-viewer" class="modal">
        <div class="modal-content viewer-card">
            <img id="full-image" class="viewer-img" src="" alt="Winner">
            <h3 id="viewer-name">ชื่อผู้โชคดี</h3>
            <button class="btn-close-viewer" onclick="closeImageViewer()">ปิด</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
